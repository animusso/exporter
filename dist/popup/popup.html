<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animus Exporter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background-color: #000000;
      color: #ffffff;
      font-feature-settings: "rlig" 1, "calt" 1;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header svg { height: 20px; width: auto; }

    .content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .export-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      letter-spacing: -0.01em;
    }

    .export-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateX(2px);
    }

    .export-btn:active {
      transform: translateX(0);
      background: rgba(255, 255, 255, 0.08);
    }

    .export-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    .export-btn:disabled:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
      transform: none;
    }

    .export-btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .export-btn-icon.twitter {
      background: rgba(29, 155, 240, 0.15);
    }

    .export-btn-icon.twitter svg {
      width: 18px;
      height: 18px;
      fill: #1d9bf0;
    }

    .export-btn-info {
      flex: 1;
      min-width: 0;
    }

    .export-btn-title {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    .export-btn-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 2px;
    }

    .export-btn-arrow {
      color: rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .status-bar {
      display: none;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      align-items: center;
      gap: 10px;
    }

    .status-bar.visible {
      display: flex;
    }

    .status-bar.error {
      border-color: rgba(239, 68, 68, 0.2);
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
    }

    .status-bar.success {
      border-color: rgba(34, 197, 94, 0.2);
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    .status-bar.error .spinner,
    .status-bar.success .spinner { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      padding: 12px 20px 16px;
      text-align: center;
    }

    .footer-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

    </svg>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="section-label">Export bookmarks</div>

    <!-- Twitter Export Button -->
    <button id="twitter-export-btn" class="export-btn">
      <div class="export-btn-icon twitter">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </div>
      <div class="export-btn-info">
        <div class="export-btn-title">Twitter / X Bookmarks</div>
        <div class="export-btn-desc">Export all bookmarked tweet IDs</div>
      </div>
      <svg class="export-btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <!-- Status Bar -->
    <div id="status-bar" class="status-bar">
      <div class="spinner"></div>
      <span id="status-text">Exporting...</span>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-text">Animus Exporter v0.1.0</span>
  </div>

  <script src="index.js"></script>
</body>
</html>
